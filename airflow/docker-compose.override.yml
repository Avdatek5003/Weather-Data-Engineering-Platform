services:
  scheduler:
    networks:
      - airflow
      - weather_data_net

    volumes:
      # Spark ETL application files
      - C:/Python/Weather_Data_Pipeline/spark_jobs:/opt/spark/work-dir/jobs:ro

      # Existing Hadoop configuration
      - C:/Python/Weather_Data_Pipeline/infra/spark-hdfs/config/core-site.xml:/opt/spark/conf/core-site.xml:ro
      - C:/Python/Weather_Data_Pipeline/infra/spark-hdfs/config/hdfs-site.xml:/opt/spark/conf/hdfs-site.xml:ro

    environment:
      # Hadoop configuration location
      HADOOP_CONF_DIR: /opt/spark/conf

      # PostgreSQL JDBC connection for historical Spark pipeline
      WEATHER_DB_USER: ${DB_USER:?DB_USER is required}
      WEATHER_DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      WEATHER_JDBC_URL: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}

      # Spark standalone cluster
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_DRIVER_HOST: scheduler

networks:
  airflow:
    driver: bridge

  weather_data_net:
    external: true
    name: weather_data_net
services:

  namenode:
    image: apache/hadoop:3.4.1
    container_name: weather_hdfs_namenode
    hostname: namenode
    user: root

    command:
      - bash
      - -c
      - |
        if [ ! -d /data/namenode/current ]; then
          echo "Formatting NameNode..."
          hdfs namenode -format -force -nonInteractive
        fi

        echo "Starting NameNode..."
        exec hdfs namenode

    ports:
      - "9870:9870"
      - "8020:8020"

    volumes:
      - namenode_data:/data/namenode
      - ./config/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./config/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro

    networks:
      - weather_data_net

    restart: unless-stopped


  datanode:
    image: apache/hadoop:3.4.1
    container_name: weather_hdfs_datanode
    hostname: datanode
    user: root

    command:
      - bash
      - -c
      - |
        echo "Waiting for NameNode..."

        until hdfs dfsadmin -report >/dev/null 2>&1; do
          sleep 5
        done

        echo "Starting DataNode..."
        exec hdfs datanode

    depends_on:
      - namenode

    ports:
      - "9864:9864"

    volumes:
      - datanode_data:/data/datanode
      - ./config/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./config/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro

    networks:
      - weather_data_net

    restart: unless-stopped


volumes:

  namenode_data:
    name: weather_hdfs_namenode_data

  datanode_data:
    name: weather_hdfs_datanode_data


networks:

  weather_data_net:
    name: weather_data_net
    external: true